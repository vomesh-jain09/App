<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Apply Coupon</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let coupon of coupons">
      <ion-label>
        <h2>{{ coupon.code }}</h2>
        <p *ngIf="coupon.isPercentage">
          Save {{ coupon.saved }}% on orders over {{ coupon.minAmount | currency }}
        </p>
        <p *ngIf="!coupon.isPercentage">
          Save {{ coupon.saved | currency }}
        </p>
      </ion-label>
      <ion-buttons slot="end">
        <ion-button 
          [disabled]="orderTotal && orderTotal < coupon.minAmount" 
          (click)="applyCoupon(coupon)">
          Apply
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>
</ion-content>
